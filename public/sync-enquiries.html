<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BA Foods — Sync Local Enquiries to Database</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 60px auto; padding: 20px; background: #f5f5f5; }
        h2 { color: #1e3d2f; }
        #status { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 20px; margin-top: 20px; min-height: 100px; white-space: pre-wrap; font-family: monospace; font-size: 13px; }
        button { background: #1e3d2f; color: #fff; border: none; padding: 12px 28px; border-radius: 4px; font-size: 15px; cursor: pointer; margin-top: 10px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .ok { color: green; }
        .err { color: red; }
        .warn { color: #8c763e; }
    </style>
</head>
<body>
    <h2>BA Foods — One-Time Enquiry Sync</h2>
    <p>This page reads enquiries stored locally in this browser and uploads them to the shared Neon database.</p>
    <button id="btn">Start Sync</button>
    <div id="status">Press "Start Sync" to begin...</div>

    <script>
        const log = (msg, cls) => {
            const el = document.getElementById('status');
            const line = document.createElement('div');
            line.textContent = msg;
            if (cls) line.className = cls;
            el.appendChild(line);
            el.scrollTop = el.scrollHeight;
        };

        document.getElementById('btn').addEventListener('click', async () => {
            const btn = document.getElementById('btn');
            btn.disabled = true;
            document.getElementById('status').innerHTML = '';

            const raw = localStorage.getItem('ba_enquiries');
            if (!raw) {
                log('No ba_enquiries found in localStorage. Nothing to sync.', 'warn');
                btn.disabled = false;
                return;
            }

            let enquiries;
            try {
                enquiries = JSON.parse(raw);
            } catch (e) {
                log('Failed to parse localStorage data: ' + e.message, 'err');
                btn.disabled = false;
                return;
            }

            if (!enquiries.length) {
                log('localStorage is empty. Nothing to sync.', 'warn');
                btn.disabled = false;
                return;
            }

            log(`Found ${enquiries.length} enquiry(s) in localStorage. Uploading...`);

            let successCount = 0;
            let failCount = 0;

            for (const enq of enquiries) {
                const payload = {
                    company:    enq.company    || 'Unknown',
                    contact:    enq.contact    || 'Unknown',
                    email:      enq.email      || 'unknown@unknown.com',
                    phone:      enq.phone      || '0000000000',
                    country:    enq.country    || 'Not Specified',
                    cut_type:   enq.cut_type   || 'General Inquiry',
                    volume_mt:  enq.volume_mt  || 0,
                    frequency:  enq.frequency  || 'One-time',
                    notes:      enq.notes      || ''
                };

                try {
                    const res = await fetch('/api/enquiry', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (data.success) {
                        log(`✓ Synced: ${enq.company} (${enq.email}) → ${data.id}`, 'ok');
                        successCount++;
                    } else {
                        log(`✗ Failed: ${enq.company} — ${data.error}`, 'err');
                        failCount++;
                    }
                } catch (e) {
                    log(`✗ Network error for ${enq.company}: ${e.message}`, 'err');
                    failCount++;
                }
            }

            log('');
            log(`Done. ${successCount} synced, ${failCount} failed.`, successCount > 0 ? 'ok' : 'err');

            if (successCount > 0 && failCount === 0) {
                log('Clearing localStorage now that all enquiries are in the database.', 'warn');
                localStorage.removeItem('ba_enquiries');
            } else if (failCount > 0) {
                log('Some failed — localStorage NOT cleared. Fix errors and retry.', 'warn');
            }

            btn.disabled = false;
        });
    </script>
</body>
</html>
